name: CI Release Gate & Database Persistence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Monorepo Verification & PostgreSQL Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ca_career_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema
        run: pnpm --filter @ca-career-os/api prisma validate

      - name: Apply Prisma Migrations to PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ca_career_os_test
        run: pnpm --filter @ca-career-os/api prisma migrate deploy

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Validate Diagrams & Documentation Architecture
        run: node scripts/validate-diagrams.mjs

      - name: Build Next.js Web App
        run: pnpm --filter @ca-career-os/web build

      - name: Run Full Monorepo Test Suite (149 Tests)
        run: pnpm test

      - name: Execute Live PostgreSQL Persistence Workflows
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ca_career_os_test
          CI: 'true'
          REQUIRE_DB: 'true'
        run: pnpm --filter @ca-career-os/api test:db
