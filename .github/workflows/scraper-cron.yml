name: Scheduled Articleship & Job Scraper Daemon

on:
  schedule:
    # Runs automatically every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub UI

permissions:
  contents: write # Allows committing updated job stores back to GitHub

jobs:
  scrape-and-sync:
    name: Scrape Portals, Sync Jobs & Dispatch SMTP Alert
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core Modules
        run: pnpm --filter @ca-career-os/shared build && pnpm --filter @ca-career-os/api build

      - name: Run Scraper Engine & SMTP Alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE || 'false' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_EMAIL: ${{ secrets.SMTP_FROM_EMAIL || secrets.SMTP_USER }}
          SMTP_FROM_NAME: "CharteredOS Scraper Daemon"
          ADMIN_NOTIFICATION_EMAIL: ${{ secrets.ADMIN_NOTIFICATION_EMAIL || secrets.SMTP_USER }}
        run: node scripts/run-scraper-sync.mjs

      - name: Commit and Push Updated Scraped Jobs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions [Scraper Daemon]"
          git add data/jobs_store.json apps/web/src/data/jobs_store.json || true
          if git diff --staged --quiet; then
            echo "No new changes to commit."
          else
            git commit -m "chore(data): auto-update scraped articleship opportunities [skip ci]"
            git push
          fi

