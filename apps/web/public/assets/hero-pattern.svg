<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" fill="none">
  <defs>
    <radialGradient id="meshCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1.5" fill="rgba(99, 102, 241, 0.25)" />
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#meshCenter)" />
  <rect width="800" height="800" fill="url(#grid)" />
</svg>
