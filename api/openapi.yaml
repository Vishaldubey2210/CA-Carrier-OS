openapi: 3.0.3
info:
  title: CA Career OS — Core REST API
  description: >
    Production-grade RESTful API specification for CA Career OS — the intelligent
    career management and professional operations platform for Chartered Accountants in India.
  version: 1.0.0
  contact:
    name: CA Career OS Engineering Team
    email: architect@cacareer.os
servers:
  - url: https://api.cacareeros.com
    description: Production API Gateway
  - url: https://staging-api.cacareeros.com
    description: Staging Environment
  - url: http://localhost:4000
    description: Local Development Server

security:
  - BearerAuth: []

paths:
  /api/v1/auth/register:
    post:
      summary: Register a new candidate or recruiter account
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered and personal workspace provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/400ValidationError'
        '409':
          description: User with email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/v1/auth/login:
    post:
      summary: Authenticate user credentials and issue session tokens
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: refreshToken=abc-123; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth/refresh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /api/v1/career/profile:
    get:
      summary: Fetch candidate career profile and skills
      tags: [Career Intelligence]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Candidate profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfileResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
    post:
      summary: Create or update candidate articleship inventory and preferences
      tags: [Career Intelligence]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfileInput'
      responses:
        '200':
          description: Profile successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateProfileResponse'
        '400':
          $ref: '#/components/responses/400ValidationError'

  /api/v1/career/diagnostic:
    post:
      summary: Calculate 6-pathway fit scores and skill gaps
      tags: [Career Intelligence]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Pathway recommendation and skill gap analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillGapReportResponse'

  /api/v1/jobs:
    get:
      summary: Hybrid lexical and semantic search for verified CA jobs
      tags: [Jobs & Recruitment]
      parameters:
        - name: query
          in: query
          schema:
            type: string
          description: Keyword search string (e.g., "Statutory Audit Manager")
        - name: caPathway
          in: query
          schema:
            type: string
            enum: [AUDIT, TAX, FPA, CORP_FIN, IB, CONSULTING, PRACTICE]
        - name: city
          in: query
          schema:
            type: string
            example: Mumbai
        - name: minSalary
          in: query
          schema:
            type: integer
            example: 1200000
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated job listings with match scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
    post:
      summary: Direct recruiter or employer job publishing
      tags: [Jobs & Recruitment]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '201':
          description: Job posting created and published

  /api/v1/jobs/ingest:
    post:
      summary: Multi-source job ingestion pipeline with fingerprinting and deduplication
      tags: [Jobs & Recruitment]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Ingestion batch processed

  /api/v1/jobs/saved:
    get:
      summary: List saved jobs for the candidate
      tags: [Jobs & Recruitment]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Array of saved jobs

  /api/v1/jobs/{id}:
    get:
      summary: Get job details with candidate match score
      tags: [Jobs & Recruitment]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details

  /api/v1/jobs/{id}/match:
    get:
      summary: Calculate explainable job match against candidate profile
      tags: [Jobs & Recruitment]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Explainable match report

  /api/v1/jobs/{id}/save:
    post:
      summary: Save a job to personal candidate workspace
      tags: [Jobs & Recruitment]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Job saved successfully
    delete:
      summary: Unsave a job from candidate workspace
      tags: [Jobs & Recruitment]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Job unsaved

  /api/v1/applications:
    get:
      summary: List candidate application tracking records (Candidate Blindfold protected)
      tags: [Application Management]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Array of tracked applications
    post:
      summary: Create new application tracking record
      tags: [Application Management]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '201':
          description: Application tracking record created

  /api/v1/applications/{id}:
    get:
      summary: Get application details with status history and follow-up tasks
      tags: [Application Management]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application record with history

  /api/v1/applications/{id}/status:
    patch:
      summary: Transition application status with validation of valid workflow state progression
      tags: [Application Management]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Application status transitioned and audit recorded

  /api/v1/applications/{id}/follow-ups:
    post:
      summary: Create a follow-up task for an application
      tags: [Application Management]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Follow-up task created

  /api/v1/resumes:
    get:
      summary: List resume summaries for candidate
      tags: [Resume & Branding]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Array of candidate resumes
    post:
      summary: Create master resume from candidate profile facts
      tags: [Resume & Branding]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '201':
          description: Master resume created

  /api/v1/resumes/draft-letter:
    post:
      summary: Generate job-specific cover letter draft based on verified candidate profile facts
      tags: [Resume & Branding]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Cover letter draft

  /api/v1/resumes/portfolio:
    get:
      summary: List portfolio entries
      tags: [Resume & Branding]
      responses:
        '200':
          description: Array of portfolio entries
    post:
      summary: Create portfolio entry
      tags: [Resume & Branding]
      responses:
        '201':
          description: Portfolio entry created

  /api/v1/resumes/tailor:
    post:
      summary: Tailor resume to target job with Zero-Fabrication Guard (ADR-009)
      tags: [Resume & Branding]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeTailorRequest'
      responses:
        '201':
          description: Tailored resume draft ready for candidate attestation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeDraftResponse'

  /api/v1/resumes/{id}/attest:
    post:
      summary: Attest factual claims and render downloadable PDF resume
      tags: [Resume & Branding]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidateAttested]
              properties:
                candidateAttested:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Attestation recorded and PDF download URL issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      resumeVersionId:
                        type: string
                        format: uuid
                      pdfDownloadUrl:
                        type: string
                        format: uri
                      expiresAt:
                        type: string
                        format: date-time

  /api/v1/interviews/sessions:
    post:
      summary: Initialize an interactive technical mock interview session
      tags: [Interview & Skills Lab]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetRole, domain]
              properties:
                targetRole:
                  type: string
                  example: Senior Statutory Auditor
                domain:
                  type: string
                  enum: [AUDIT, TAX, FPA]
      responses:
        '201':
          description: Session created with initial technical scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterviewSessionResponse'

  /api/v1/interviews/questions:
    get:
      summary: Browse and filter technical question bank
      tags: [Interview & Skills Lab]
      parameters:
        - name: pathway
          in: query
          schema:
            type: string
            enum: [AUDIT, TAX, FPA, CORP_FIN, IB, CONSULTING, PRACTICE]
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [BEGINNER, INTERMEDIATE, ADVANCED]
        - name: query
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of filtered technical questions with rubric criteria

  /api/v1/interviews/sessions/{id}:
    get:
      summary: Retrieve candidate mock interview session details and question states
      tags: [Interview & Skills Lab]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Full session state including questions, answers, and scores

  /api/v1/interviews/sessions/{id}/answers:
    post:
      summary: Submit candidate answer for rubric evaluation
      tags: [Interview & Skills Lab]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, answer]
              properties:
                questionId:
                  type: string
                  format: uuid
                answer:
                  type: string
      responses:
        '200':
          description: Evaluated question item with score, strengths, and improvement areas

  /api/v1/interviews/sessions/{id}/evaluate:
    post:
      summary: Conclude interview session, aggregate overall score, and generate adaptive learning tasks
      tags: [Interview & Skills Lab]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Completed session evaluation report with roadmap task injection

  /api/v1/billing/plans:
    get:
      summary: List available SaaS subscription plans and entitlements
      tags: [Billing & Subscriptions]
      responses:
        '200':
          description: List of available plans

  /api/v1/billing/subscription:
    get:
      summary: Get active workspace subscription state
      tags: [Billing & Subscriptions]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Current subscription details

  /api/v1/billing/checkout:
    post:
      summary: Initiate Razorpay checkout order for plan upgrade
      tags: [Billing & Subscriptions]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Checkout session created

  /api/v1/billing/webhooks/razorpay:
    post:
      summary: Process signature-verified Razorpay payment webhook
      tags: [Billing & Subscriptions]
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook processed idempotently
        '401':
          description: Invalid webhook signature

  /api/v1/billing/invoices:
    get:
      summary: List GST-compliant tax invoices for workspace
      tags: [Billing & Subscriptions]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Invoices list

  /api/v1/financial/unbundle-ctc:
    post:
      summary: Unbundle CTC offer terms into take-home pay and tax estimates
      tags: [Financial Intelligence]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnbundleCtcRequest'
      responses:
        '200':
          description: Detailed breakdown of in-hand salary and tax impact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnbundleCtcResponse'

  /api/v1/financial/salary-benchmarks:
    get:
      summary: Retrieve verified salary benchmarks with provenance and limitations
      tags: [Financial Intelligence]
      parameters:
        - name: pathway
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: industry
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of salary benchmarks

  /api/v1/financial/offers:
    get:
      summary: List candidate private offer comparison entries
      tags: [Financial Intelligence]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: User offer comparisons
    post:
      summary: Record new offer comparison entry
      tags: [Financial Intelligence]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '201':
          description: Offer comparison created

  /api/v1/mentorship/mentors:
    get:
      summary: List verified senior CA mentors
      tags: [Mentorship Marketplace]
      parameters:
        - name: pathway
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of mentors

  /api/v1/mentorship/bookings:
    get:
      summary: List candidate mentor bookings
      tags: [Mentorship Marketplace]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: List of bookings
    post:
      summary: Reserve mentor session slot with concurrency conflict prevention
      tags: [Mentorship Marketplace]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '201':
          description: Booking confirmed
        '409':
          description: Slot already reserved

  /api/v1/community/posts:
    get:
      summary: List active professional community threads
      tags: [Professional Community]
      responses:
        '200':
          description: List of discussion posts
    post:
      summary: Create community post with ICAI Code of Ethics non-solicitation enforcement
      tags: [Professional Community]
      responses:
        '201':
          description: Post published
        '400':
          description: Ethics solicitation violation

  /api/v1/practice/post-qualification/checklist:
    get:
      summary: Retrieve personalized post-qualification statutory checklist
      tags: [Practice Management]
      responses:
        '200':
          description: Post-qualification checklist items

  /api/v1/practice/clients:
    get:
      summary: List firm clients within authorized practice workspace
      tags: [Practice Management]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Client records
    post:
      summary: Add client record to firm practice directory
      tags: [Practice Management]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '201':
          description: Client created

  /api/v1/practice/tasks:
    get:
      summary: List statutory compliance tasks with filing deadlines
      tags: [Practice Management]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Compliance tasks
    post:
      summary: Create compliance task for client
      tags: [Practice Management]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '201':
          description: Compliance task created

  /api/v1/recruitment/employers:
    get:
      summary: List verified employers and companies
      tags: [Recruitment Operations]
      responses:
        '200':
          description: Employer directory

  /api/v1/recruitment/candidate-discovery:
    get:
      summary: Controlled candidate discovery with consent and privacy masking
      tags: [Recruitment Operations]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      responses:
        '200':
          description: Candidate matches

  /api/v1/agent/chat:
    post:
      summary: Send prompt to AI Career Agent and stream response or approval cards
      tags: [AI Career Agent]
      parameters:
        - $ref: '#/components/parameters/WorkspaceIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: Review my profile and draft an application to Deloitte Statutory Audit
      responses:
        '200':
          description: Assistant response or pending approval card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'

  /api/v1/approvals/{id}/confirm:
    post:
      summary: Confirm and execute an EXPLICITLY_APPROVED_EXTERNAL agent action
      tags: [AI Career Agent]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/WorkspaceIdHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedApprovalToken]
              properties:
                signedApprovalToken:
                  type: string
      responses:
        '200':
          description: Action executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      executionId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: COMPLETED
        '410':
          description: Approval token expired (15-minute TTL elapsed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WorkspaceIdHeader:
      name: X-Workspace-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Active tenant workspace UUID

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated unique UUID to prevent duplicate mutations

  responses:
    400ValidationError:
      description: Schema validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    401Unauthorized:
      description: Missing, invalid, or expired session token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    403Forbidden:
      description: User lacks authorization to access workspace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            accessToken:
              type: string
            expiresIn:
              type: integer
              example: 900
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                firstName:
                  type: string
                role:
                  type: string
            defaultWorkspaceId:
              type: string
              format: uuid

    CandidateProfileInput:
      type: object
      properties:
        articleshipFirmTier:
          type: string
          enum: [BIG4, TOP10, MID_SIZE, SMALL]
        articleshipAreas:
          type: array
          items:
            type: string
        targetCities:
          type: array
          items:
            type: string
        targetSalaryMin:
          type: integer
          example: 1200000

    CandidateProfileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object

    SkillGapReportResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            pathwayScores:
              type: object
            missingSkills:
              type: array
              items:
                type: string

    JobListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            jobs:
              type: array
              items:
                type: object
            pagination:
              type: object

    ResumeTailorRequest:
      type: object
      required: [baseResumeId, targetJobId]
      properties:
        baseResumeId:
          type: string
          format: uuid
        targetJobId:
          type: string
          format: uuid
        focusAreas:
          type: array
          items:
            type: string

    ResumeDraftResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            resumeVersionId:
              type: string
              format: uuid
            status:
              type: string
              example: DRAFT_PENDING_ATTESTATION

    InterviewSessionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            sessionId:
              type: string
              format: uuid
            currentTurn:
              type: integer
            initialQuestion:
              type: string

    UnbundleCtcRequest:
      type: object
      required: [grossCtc, fixedComponent]
      properties:
        grossCtc:
          type: integer
          example: 1500000
        fixedComponent:
          type: integer
          example: 1200000
        variableComponent:
          type: integer
          example: 200000
        joiningBonus:
          type: integer
          example: 100000
        cityTier:
          type: string
          enum: [METRO, NON_METRO]

    UnbundleCtcResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            monthlyInHandOldRegime:
              type: integer
            monthlyInHandNewRegime:
              type: integer
            retiralsDeducted:
              type: integer

    AgentChatResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            message:
              type: string
            approvalRequired:
              type: boolean
            approvalCard:
              type: object

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message, correlationId, timestamp]
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
            details:
              type: array
              items:
                type: object
            correlationId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time
